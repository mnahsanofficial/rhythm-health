name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      # Root contract checks import FastAPI, so the backend goes first.
      - name: Install backend
        run: uv sync
        working-directory: backend
      - name: Install JavaScript dependencies
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Root tests, including logs:check
        run: npm test
      - run: npm run contract:check
      - run: npm run brand:check
      - name: Web build, with the fake public values tests use
        run: |
          set -a
          . frontend/.env.test
          set +a
          npm run build
      - name: Backend tests
        run: uv run pytest
        working-directory: backend

  discipline:
    name: Secrets, migrations, commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      # All of history, so a secret in an old commit or a session log is still found.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks, pinned and checked
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar xzf gitleaks.tar.gz gitleaks
      # --redact keeps any value out of these public logs: they show the rule and file only.
      - name: Scan for secrets
        run: ./gitleaks detect --source . --redact --no-banner --verbose --config .gitleaks.toml
      - name: Apply, roll back and re-apply every migration
        env:
          MIGRATION_CHECK_DB_URL: postgresql://postgres@localhost:5432/postgres
        run: python3 backend/tests/migrations/check_all_migrations.py
      - name: Commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        if: github.event_name == 'pull_request'
        run: node scripts/check-commits.mjs

  browser:
    name: Browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      # Supabase and the API are mocked, using the fake values in frontend/.env.test.
      - run: npm run test:e2e
      - name: Keep the traces when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
